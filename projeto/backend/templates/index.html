<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Stellarium</title>

<style>
body {
    background: radial-gradient(circle at top, #0b0f1a, #05070d);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
}

h1 {
    margin: 20px 0;
    font-size: 32px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.card {
    background: #111827;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    width: 260px;
}

h3 {
    margin-bottom: 15px;
}

button {
    padding: 12px;
    margin: 6px;
    font-size: 14px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

.on { background: #2ecc71; }
.off { background: #e74c3c; }
.control { background: #3498db; }
.special { background: #9b59b6; }

input {
    width: 90%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
    text-align: center;
}
</style>
</head>

<body>

<h1>🌌 Controle Stellarium</h1>

<form method="post" action="/acao">

<div class="container">

<div class="card">
<h3>🌍 Ambiente</h3>
<button name="acao" value="atmos_on" class="on">Atmosfera ON</button>
<button name="acao" value="atmos_off" class="off">Atmosfera OFF</button>
<button name="acao" value="land_on" class="on">Paisagem ON</button>
<button name="acao" value="land_off" class="off">Paisagem OFF</button>
</div>

<div class="card">
<h3>✨ Constelações</h3>
<button name="acao" value="const_on" class="on">Ativar</button>
<button name="acao" value="const_off" class="off">Desativar</button>
<button name="acao" value="art_constelation_on" class="on">Desenho ON</button>
<button name="acao" value="art_constelation_off" class="off">Desenho OFF</button>
<button name="acao" value="name_constelation_on" class="on">Nome ON</button>
<button name="acao" value="name_constelation_off" class="off">Nome OFF</button>
</div>

<div class="card">
<h3>⏱ Tempo</h3>
<button name="acao" value="time_forward" class="control">⏩ Avançar</button>
<button name="acao" value="time_pause" class="control">⏸ Pausar</button>
<button name="acao" value="time_back" class="control">⏪ Voltar</button>
</div>

<div class="card">
<h3>🔭 Buscar Objeto</h3>
<input name="corpo_celeste" type="text" placeholder="Ex: Mars">
<button name="acao" value="buscar_objeto" class="control">🔍 Buscar</button>
</div>

<div class="card">
<h3>🎤 Modo Especial</h3>
<button name="acao" value="modo_palestra" class="special">Modo Palestra</button>
</div>

</div>

</form>

</body>
</html>
